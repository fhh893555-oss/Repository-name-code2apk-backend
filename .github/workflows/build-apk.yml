name: Build Flutter APK with Gemini

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Application name"
        required: true
        type: string

      package_id:
        description: "Android package ID"
        required: true
        type: string

      project_name:
        description: "Flutter project name"
        required: true
        type: string

      description:
        description: "Application description"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Flutter
      # ==========================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.6"
          channel: stable
          cache: true


      # ==========================================
      # 3. Create Flutter project
      # ==========================================

      - name: Create Flutter project
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_ID: ${{ inputs.package_id }}
        run: |

          rm -rf flutter_app

          PROJECT_NAME=$(echo "$APP_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9_]/_/g' \
            | sed 's/^_*//' \
            | sed 's/_*$//')

          if [ -z "$PROJECT_NAME" ]; then
            PROJECT_NAME="generated_app"
          fi

          case "$PROJECT_NAME" in
            [0-9]*)
              PROJECT_NAME="app_$PROJECT_NAME"
              ;;
          esac

          case "$PROJECT_NAME" in
            abstract|as|assert|async|await|break|case|catch|class|const|continue|covariant|default|deferred|do|dynamic|else|enum|export|extends|extension|external|factory|false|final|finally|for|Function|get|hide|if|implements|import|in|interface|is|late|library|mixin|new|null|on|operator|part|required|rethrow|return|set|show|static|super|switch|sync|this|throw|true|try|typedef|var|void|while|with|yield)
              PROJECT_NAME="generated_app"
              ;;
          esac

          echo "=========================================="
          echo "Application name: $APP_NAME"
          echo "Package ID: $PACKAGE_ID"
          echo "Flutter project name: $PROJECT_NAME"
          echo "=========================================="

          flutter create \
            --org "$PACKAGE_ID" \
            --project-name "$PROJECT_NAME" \
            flutter_app


      # ==========================================
      # 4. Generate Flutter code with Gemini
      # ==========================================

      - name: Generate Flutter code with Gemini
        working-directory: flutter_app
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_NAME: ${{ inputs.app_name }}
          APP_DESCRIPTION: ${{ inputs.description }}
        run: |

          python3 - <<'PY'

          import json
          import os
          import re
          import time
          import urllib.request
          import urllib.error
          from pathlib import Path


          # ==========================================
          # Environment
          # ==========================================

          api_key = os.environ["GEMINI_API_KEY"]
          app_name = os.environ["APP_NAME"]
          description = os.environ["APP_DESCRIPTION"]


          if not api_key:
              print("ERROR: GEMINI_API_KEY is empty.")
              raise SystemExit(1)


          # ==========================================
          # Gemini prompt
          # ==========================================

          prompt = f"""
          You are an expert Flutter developer.

          Create a complete, functional Flutter application.

          USER REQUEST:
          {description}

          APPLICATION NAME:
          {app_name}

          REQUIREMENTS:

          1. Generate a REAL working Flutter application.

          2. Do not create a mockup.

          3. All requested buttons and functions must work.

          4. Use Material 3.

          5. Create a modern and beautiful interface.

          6. If Arabic is requested, support Arabic RTL.

          7. The application must compile with Flutter 3.35.6.

          8. Use Flutter SDK libraries whenever possible.

          9. You may use flutter_localizations when needed.

          10. Avoid unnecessary external packages.

          11. Include every required import.

          12. Include a valid main() function.

          13. Keep the application inside lib/main.dart.

          14. Do not explain the code.

          15. Do not use Markdown.

          16. Return ONLY the complete Dart source code.

          17. Do not return code fences.

          18. Check the Dart syntax before returning.

          19. Make every requested feature actually functional.

          20. Make the application ready to build as an APK.
          """


          # ==========================================
          # Gemini API URL
          # ==========================================

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-2.5-flash:generateContent"
              "?key=" + api_key
          )


          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.2,
                  "maxOutputTokens": 30000
              }
          }


          data = json.dumps(payload).encode("utf-8")


          # ==========================================
          # Retry Gemini request
          # ==========================================

          max_attempts = 5
          result = None


          for attempt in range(1, max_attempts + 1):

              print("")
              print("==========================================")
              print(
                  f"Gemini request attempt {attempt}/{max_attempts}"
              )
              print("==========================================")


              request = urllib.request.Request(
                  url,
                  data=data,
                  headers={
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )


              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=180
                  ) as response:

                      status_code = response.status

                      response_text = (
                          response.read()
                          .decode("utf-8")
                      )


                  print(
                      "Gemini HTTP status:",
                      status_code
                  )


                  result = json.loads(
                      response_text
                  )


                  # Successful response.

                  if status_code == 200:

                      print(
                          "Gemini request succeeded."
                      )

                      break


              except urllib.error.HTTPError as e:

                  status_code = e.code

                  error_body = (
                      e.read()
                      .decode(
                          "utf-8",
                          errors="replace"
                      )
                  )


                  print(
                      "Gemini HTTP error:",
                      status_code
                  )

                  print(error_body)


                  # Retry temporary errors.

                  if status_code in (429, 500, 502, 503, 504):

                      if attempt < max_attempts:

                          wait_seconds = 15 * attempt

                          print(
                              f"Temporary Gemini error."
                              f" Waiting {wait_seconds}"
                              f" seconds before retry..."
                          )

                          time.sleep(
                              wait_seconds
                          )

                          continue


                  print(
                      "Gemini request failed permanently."
                  )

                  raise SystemExit(1)


              except Exception as e:

                  print(
                      "Gemini request exception:"
                  )

                  print(str(e))


                  if attempt < max_attempts:

                      wait_seconds = 15 * attempt

                      print(
                          f"Retrying in "
                          f"{wait_seconds} seconds..."
                      )

                      time.sleep(
                          wait_seconds
                      )

                      continue


                  raise SystemExit(1)


          # ==========================================
          # Check final response
          # ==========================================

          if result is None:

              print(
                  "ERROR: Gemini did not return a response."
              )

              raise SystemExit(1)


          # ==========================================
          # Extract generated code
          # ==========================================

          try:

              generated_code = (
                  result["candidates"][0]
                  ["content"]
                  ["parts"][0]
                  ["text"]
              )

          except Exception:

              print(
                  "=========================================="
              )

              print(
                  "UNEXPECTED GEMINI RESPONSE"
              )

              print(
                  "=========================================="
              )

              print(
                  json.dumps(
                      result,
                      indent=2,
                      ensure_ascii=False
                  )
              )

              raise SystemExit(1)


          generated_code = generated_code.strip()


          # ==========================================
          # Remove Markdown fences
          # ==========================================

          if generated_code.startswith("```"):

              generated_code = re.sub(
                  r"^```(?:dart)?\s*",
                  "",
                  generated_code,
                  flags=re.IGNORECASE
              )

              generated_code = re.sub(
                  r"\s*```$",
                  "",
                  generated_code
              )


          generated_code = generated_code.strip()


          # ==========================================
          # Validate generated code
          # ==========================================

          if not generated_code:

              print(
                  "ERROR: Gemini returned empty code."
              )

              raise SystemExit(1)


          if "void main(" not in generated_code:

              print(
                  "ERROR: Generated code does not contain main()."
              )

              print(
                  generated_code[:10000]
              )

              raise SystemExit(1)


          # ==========================================
          # Save main.dart
          # ==========================================

          Path(
              "lib/main.dart"
          ).write_text(
              generated_code,
              encoding="utf-8"
          )


          print("")
          print("==========================================")
          print(
              "Gemini generated Flutter code successfully."
          )
          print("==========================================")

          print(
              "Generated code size:",
              len(generated_code),
              "characters"
          )

          PY


      # ==========================================
      # 5. Add required Flutter localization
      # ==========================================

      - name: Fix Flutter dependencies
        working-directory: flutter_app
        run: |

          flutter pub add flutter_localizations --sdk=flutter

          flutter pub get


      # ==========================================
      # 6. Remove default test
      # ==========================================

      - name: Remove default Flutter test
        working-directory: flutter_app
        run: |

          rm -f test/widget_test.dart


      # ==========================================
      # 7. Analyze
      # ==========================================

      - name: Analyze Flutter project
        working-directory: flutter_app
        run: |

          flutter analyze


      # ==========================================
      # 8. Build APK
      # ==========================================

      - name: Build APK
        working-directory: flutter_app
        run: |

          flutter build apk --release


      # ==========================================
      # 9. Upload APK
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Code2APK-${{ inputs.project_name }}
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
