name: Build Flutter APK with Gemini

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Application name"
        required: true
        type: string

      package_id:
        description: "Android package ID"
        required: true
        type: string

      project_name:
        description: "Flutter project name"
        required: true
        type: string

      description:
        description: "Application description"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.6"
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          rm -rf flutter_app

          flutter create \
            --org "${{ inputs.package_id }}" \
            --project-name "${{ inputs.project_name }}" \
            flutter_app

      - name: Generate Flutter code with Gemini
        working-directory: flutter_app
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_NAME: ${{ inputs.app_name }}
          APP_DESCRIPTION: ${{ inputs.description }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          import urllib.error
          from pathlib import Path

          api_key = os.environ["GEMINI_API_KEY"]
          app_name = os.environ["APP_NAME"]
          description = os.environ["APP_DESCRIPTION"]

          prompt = f"""
          You are an expert Flutter developer.

          Generate a complete Flutter application based ONLY on this user request:

          {description}

          Application name:
          {app_name}

          Requirements:

          1. Generate production-quality Flutter/Dart code.
          2. The application must be functional, not just a mockup.
          3. Use Material 3.
          4. Make the UI modern and beautiful.
          5. Support Arabic and RTL when the requested application uses Arabic.
          6. Do not explain the code.
          7. Return ONLY the complete contents of lib/main.dart.
          8. Do not use Markdown code fences.
          9. Prefer Flutter SDK libraries only.
          10. Do not add external packages unless absolutely necessary.
          11. The code must compile with Flutter 3.35.6.
          12. Include all required imports.
          13. The code must contain a main() function.
          """

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-2.5-flash:generateContent"
              "?key=" + api_key
          )

          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.2,
                  "maxOutputTokens": 30000
              }
          }

          data = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=data,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=180) as response:
                  result = json.loads(
                      response.read().decode("utf-8")
                  )

          except urllib.error.HTTPError as e:
              error_body = e.read().decode("utf-8", errors="replace")
              print("Gemini API error:")
              print(error_body)
              raise SystemExit(1)

          except Exception as e:
              print("Gemini request failed:")
              print(str(e))
              raise SystemExit(1)

          try:
              generated_code = result["candidates"][0]["content"]["parts"][0]["text"]
          except Exception:
              print("Unexpected Gemini response:")
              print(json.dumps(result, indent=2))
              raise SystemExit(1)

          generated_code = generated_code.strip()

          # Remove Markdown fences if Gemini returns them anyway.
          if generated_code.startswith("```"):
              generated_code = re.sub(
                  r"^```(?:dart)?\s*",
                  "",
                  generated_code,
                  flags=re.IGNORECASE
              )

              generated_code = re.sub(
                  r"\s*```$",
                  "",
                  generated_code
              )

          generated_code = generated_code.strip()

          if not generated_code:
              print("Gemini returned empty code.")
              raise SystemExit(1)

          if "void main(" not in generated_code:
              print("Generated code does not contain main().")
              print(generated_code[:5000])
              raise SystemExit(1)

          Path("lib/main.dart").write_text(
              generated_code,
              encoding="utf-8"
          )

          print("Gemini generated Flutter code successfully.")
          print("main.dart size:", len(generated_code))

          PY

      - name: Get Flutter dependencies
        working-directory: flutter_app
        run: |
          flutter pub get

      - name: Analyze Flutter project
        working-directory: flutter_app
        run: |
          flutter analyze

      - name: Build APK
        working-directory: flutter_app
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Code2APK-${{ inputs.project_name }}
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
