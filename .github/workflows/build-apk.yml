name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Application name"
        required: true
        type: string

      package_id:
        description: "Package ID"
        required: true
        type: string

      project_name:
        description: "Flutter project name"
        required: true
        type: string

      description:
        description: "Application description"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. تحميل المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. تثبيت Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.6"
          channel: stable
          cache: true

      # 3. إنشاء اسم مشروع Flutter آمن
      - name: Prepare project name
        id: prepare
        shell: bash
        run: |
          APP_NAME="${{ inputs.app_name }}"

          PROJECT_NAME=$(echo "$APP_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9_]/_/g' \
            | sed 's/__*/_/g' \
            | sed 's/^_//' \
            | sed 's/_$//')

          if [ -z "$PROJECT_NAME" ]; then
            PROJECT_NAME="generated_app"
          fi

          case "$PROJECT_NAME" in
            [0-9]*)
              PROJECT_NAME="app_$PROJECT_NAME"
              ;;
          esac

          case "$PROJECT_NAME" in
            abstract|as|assert|async|await|break|case|catch|class|const|continue|covariant|default|deferred|do|dynamic|else|enum|export|extends|extension|external|factory|false|final|finally|for|Function|get|hide|if|implements|import|in|interface|is|late|library|mixin|new|null|on|operator|part|required|rethrow|return|set|show|static|super|switch|sync|this|throw|true|try|typedef|var|void|while|with|yield)
              PROJECT_NAME="app_$PROJECT_NAME"
              ;;
          esac

          echo "project_name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"

          echo "Flutter project name: $PROJECT_NAME"

      # 4. إنشاء Flutter project من الصفر
      - name: Create Flutter project
        shell: bash
        run: |
          PROJECT_NAME="${{ steps.prepare.outputs.project_name }}"

          flutter create \
            --org "${{ inputs.package_id }}" \
            "$PROJECT_NAME"

      # 5. الدخول إلى المشروع
      - name: Prepare Flutter dependencies
        working-directory: ${{ steps.prepare.outputs.project_name }}
        shell: bash
        run: |
          flutter pub add flutter_localizations --sdk=flutter
          flutter pub get

      # 6. حذف اختبار Flutter الافتراضي
      - name: Remove default test
        working-directory: ${{ steps.prepare.outputs.project_name }}
        shell: bash
        run: |
          rm -f test/widget_test.dart

      # 7. توليد التطبيق بواسطة Gemini
      - name: Generate Flutter application with Gemini
        working-directory: ${{ steps.prepare.outputs.project_name }}
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_NAME: ${{ inputs.app_name }}
          DESCRIPTION: ${{ inputs.description }}
        run: |

          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.request

          api_key = os.environ["GEMINI_API_KEY"]
          app_name = os.environ["APP_NAME"]
          description = os.environ["DESCRIPTION"]

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-2.5-flash:generateContent"
              "?key=" + api_key
          )

          prompt = f"""
          You are an expert Flutter developer.

          Build a complete Flutter application from scratch.

          Application name:
          {app_name}

          User's application idea:
          {description}

          IMPORTANT RULES:

          1. Generate a REAL working Flutter application.
          2. Do NOT create a template.
          3. Do NOT return an explanation.
          4. Do NOT return Markdown.
          5. Return ONLY the complete contents of lib/main.dart.
          6. The application must compile with Flutter 3.35.6.
          7. Use Material 3.
          8. Make the UI modern and polished.
          9. The application must actually implement the user's requested functionality.
          10. Keep the application self-contained whenever possible.
          11. Do not use packages that are not already available unless absolutely necessary.
          12. Do not use flutter_localizations unless it is actually needed.
          13. If the user asks for Arabic, support RTL correctly.
          14. Make sure there are no undefined classes, methods, variables, or imports.
          15. Make sure the final code is a complete executable Flutter main.dart.
          16. Start directly with the Dart code.
          17. End directly with the Dart code.

          User request:
          {description}
          """

          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.2,
                  "maxOutputTokens": 30000
              }
          }

          data = json.dumps(payload).encode("utf-8")

          max_attempts = 5
          response_text = None

          for attempt in range(1, max_attempts + 1):

              print(f"Gemini attempt {attempt}/{max_attempts}")

              request = urllib.request.Request(
                  url,
                  data=data,
                  headers={
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request, timeout=180) as response:
                      raw = response.read().decode("utf-8")
                      result = json.loads(raw)

                  candidates = result.get("candidates", [])

                  if not candidates:
                      raise RuntimeError(
                          "Gemini returned no candidates."
                      )

                  parts = candidates[0].get("content", {}).get("parts", [])

                  response_text = "".join(
                      part.get("text", "")
                      for part in parts
                  )

                  if not response_text.strip():
                      raise RuntimeError(
                          "Gemini returned empty text."
                      )

                  break

              except urllib.error.HTTPError as e:

                  body = e.read().decode("utf-8", errors="replace")

                  print("Gemini API HTTP error:")
                  print(body)

                  if e.code in [429, 500, 502, 503, 504]:

                      if attempt < max_attempts:
                          wait_time = 15 * attempt
                          print(
                              f"Temporary Gemini error. "
                              f"Waiting {wait_time} seconds..."
                          )
                          time.sleep(wait_time)
                          continue

                  print(
                      f"Gemini API failed with HTTP {e.code}"
                  )

                  sys.exit(1)

              except Exception as e:

                  print(f"Gemini error: {e}")

                  if attempt < max_attempts:
                      wait_time = 15 * attempt
                      print(
                          f"Retrying in {wait_time} seconds..."
                      )
                      time.sleep(wait_time)
                  else:
                      sys.exit(1)

          if not response_text:
              print("Gemini did not generate application code.")
              sys.exit(1)

          # إزالة Markdown fences إن وجدت
          code = response_text.strip()

          code = re.sub(
              r"^```dart\s*",
              "",
              code,
              flags=re.IGNORECASE
          )

          code = re.sub(
              r"^```\s*",
              "",
              code
          )

          code = re.sub(
              r"\s*```\s*$",
              "",
              code
          )

          code = code.strip()

          if not code.startswith("import") and not code.startswith("void main"):
              print("Generated response does not look like Dart code.")
              print(code[:1000])
              sys.exit(1)

          with open("lib/main.dart", "w", encoding="utf-8") as f:
              f.write(code)

          print("Flutter application generated successfully.")

      # 8. تحديث dependencies
      - name: Get Flutter dependencies
        working-directory: ${{ steps.prepare.outputs.project_name }}
        shell: bash
        run: |
          flutter pub get

      # 9. فحص الكود
      - name: Flutter analyze
        working-directory: ${{ steps.prepare.outputs.project_name }}
        shell: bash
        run: |
          flutter analyze --no-fatal-infos

      # 10. بناء APK
      - name: Build APK
        working-directory: ${{ steps.prepare.outputs.project_name }}
        shell: bash
        run: |
          flutter build apk --release

      # 11. رفع APK كـ Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: generated-apk
          path: ${{ steps.prepare.outputs.project_name }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
