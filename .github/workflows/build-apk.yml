name: Build Flutter APK with Gemini

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Application name"
        required: true
        type: string

      package_id:
        description: "Android package ID"
        required: true
        type: string

      project_name:
        description: "Flutter project name"
        required: true
        type: string

      description:
        description: "Application description"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.6"
          channel: stable
          cache: true


      - name: Create Flutter project
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_ID: ${{ inputs.package_id }}
        run: |

          rm -rf flutter_app

          PROJECT_NAME=$(echo "$APP_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9_]/_/g' \
            | sed 's/^_*//' \
            | sed 's/_*$//')

          if [ -z "$PROJECT_NAME" ]; then
            PROJECT_NAME="generated_app"
          fi

          case "$PROJECT_NAME" in
            [0-9]*)
              PROJECT_NAME="app_$PROJECT_NAME"
              ;;
          esac

          case "$PROJECT_NAME" in
            abstract|as|assert|async|await|break|case|catch|class|const|continue|covariant|default|deferred|do|dynamic|else|enum|export|extends|extension|external|factory|false|final|finally|for|Function|get|hide|if|implements|import|in|interface|is|late|library|mixin|new|null|on|operator|part|required|rethrow|return|set|show|static|super|switch|sync|this|throw|true|try|typedef|var|void|while|with|yield)
              PROJECT_NAME="generated_app"
              ;;
          esac

          echo "Project name: $PROJECT_NAME"

          flutter create \
            --org "$PACKAGE_ID" \
            --project-name "$PROJECT_NAME" \
            flutter_app


      - name: Generate Flutter code with Gemini
        working-directory: flutter_app
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_NAME: ${{ inputs.app_name }}
          APP_DESCRIPTION: ${{ inputs.description }}
        run: |

          python3 - <<'PY'

          import json
          import os
          import re
          import urllib.request
          import urllib.error
          from pathlib import Path

          api_key = os.environ["GEMINI_API_KEY"]
          app_name = os.environ["APP_NAME"]
          description = os.environ["APP_DESCRIPTION"]

          if not api_key:
              print("ERROR: GEMINI_API_KEY is empty.")
              raise SystemExit(1)

          prompt = f"""
          You are an expert Flutter developer.

          Create a complete, functional Flutter application.

          USER REQUEST:
          {description}

          APPLICATION NAME:
          {app_name}

          Requirements:

          1. Generate a REAL working Flutter application.
          2. Do not create a mockup.
          3. All requested buttons and functions must work.
          4. Use Material 3.
          5. Create a modern beautiful UI.
          6. If Arabic is requested, support Arabic RTL.
          7. The application must compile with Flutter 3.35.6.
          8. Use Flutter SDK libraries whenever possible.
          9. You may use flutter_localizations when needed.
          10. Avoid unnecessary external packages.
          11. Include every required import.
          12. Include a valid main() function.
          13. Keep the application inside lib/main.dart.
          14. Do not explain the code.
          15. Do not use Markdown.
          16. Return ONLY the complete Dart source code.
          17. Do not return ```dart or ``` markers.
          18. Check the Dart syntax before returning.
          """

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-2.5-flash:generateContent"
              "?key=" + api_key
          )

          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.2,
                  "maxOutputTokens": 30000
              }
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=180
              ) as response:

                  result = json.loads(
                      response.read().decode("utf-8")
                  )

          except urllib.error.HTTPError as e:

              print("GEMINI API ERROR:")
              print(
                  e.read().decode(
                      "utf-8",
                      errors="replace"
                  )
              )

              raise SystemExit(1)

          except Exception as e:

              print("GEMINI REQUEST FAILED:")
              print(str(e))

              raise SystemExit(1)

          try:
              generated_code = (
                  result["candidates"][0]
                  ["content"]["parts"][0]["text"]
              )

          except Exception:

              print("UNEXPECTED GEMINI RESPONSE:")

              print(
                  json.dumps(
                      result,
                      indent=2,
                      ensure_ascii=False
                  )
              )

              raise SystemExit(1)

          generated_code = generated_code.strip()

          if generated_code.startswith("```"):

              generated_code = re.sub(
                  r"^```(?:dart)?\s*",
                  "",
                  generated_code,
                  flags=re.IGNORECASE
              )

              generated_code = re.sub(
                  r"\s*```$",
                  "",
                  generated_code
              )

          generated_code = generated_code.strip()

          if not generated_code:
              print("Gemini returned empty code.")
              raise SystemExit(1)

          if "void main(" not in generated_code:
              print("Generated code does not contain main().")
              raise SystemExit(1)

          Path("lib/main.dart").write_text(
              generated_code,
              encoding="utf-8"
          )

          print("Gemini code generated successfully.")

          PY


      - name: Fix Flutter dependencies
        working-directory: flutter_app
        run: |

          flutter pub add flutter_localizations --sdk=flutter

          flutter pub get


      - name: Remove default Flutter test
        working-directory: flutter_app
        run: |

          rm -f test/widget_test.dart


      - name: Analyze Flutter project
        working-directory: flutter_app
        run: |

          flutter analyze


      - name: Build APK
        working-directory: flutter_app
        run: |

          flutter build apk --release


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Code2APK-${{ inputs.project_name }}
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
