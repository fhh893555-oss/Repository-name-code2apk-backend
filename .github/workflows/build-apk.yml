name: Build Flutter APK

on:
workflow_dispatch:
inputs:
app_name:
description: "Application name"
required: true
type: string
package_id:
    description: "Android package ID"
    required: true
    type: string

  project_name:
    description: "Flutter project name"
    required: true
    type: string

  description:
    description: "Application description"
    required: true
    type: string

jobs:
build:
runs-on: ubuntu-latest

steps:

  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      flutter-version: "3.35.6"
      channel: stable
      cache: true

  - name: Create Flutter project
    run: |
      rm -rf flutter_app

      flutter create \
        --org "${{ inputs.package_id }}" \
        --project-name "${{ inputs.project_name }}" \
        flutter_app

  - name: Generate application
    working-directory: flutter_app
    env:
      APP_NAME: ${{ inputs.app_name }}
      APP_DESCRIPTION: ${{ inputs.description }}
    run: |
      python3 - <<'PY'
      from pathlib import Path
      import os

      app_name = os.environ["APP_NAME"]
      description = os.environ["APP_DESCRIPTION"]

      path = Path("lib/main.dart")

      dart = r"""
      import 'package:flutter/material.dart';

      void main() {
        runApp(const Code2APKApp());
      }

      class Code2APKApp extends StatelessWidget {
        const Code2APKApp({super.key});

        @override
        Widget build(BuildContext context) {
          return MaterialApp(
            debugShowCheckedModeBanner: false,
            title: APP_TITLE,
            theme: ThemeData(
              colorScheme: ColorScheme.fromSeed(
                seedColor: Colors.blue,
              ),
              useMaterial3: true,
            ),
            home: const HomePage(),
          );
        }
      }

      class HomePage extends StatelessWidget {
        const HomePage({super.key});

        @override
        Widget build(BuildContext context) {
          return Scaffold(
            appBar: AppBar(
              title: const Text(APP_TITLE),
              centerTitle: true,
            ),
            body: Center(
              child: Padding(
                padding: const EdgeInsets.all(24),
                child: Column(
                  mainAxisAlignment: MainAxisAlignment.center,
                  children: [
                    const Icon(
                      Icons.phone_android,
                      size: 80,
                    ),

                    const SizedBox(height: 24),

                    const Text(
                      APP_TITLE,
                      textAlign: TextAlign.center,
                      style: TextStyle(
                        fontSize: 28,
                        fontWeight: FontWeight.bold,
                      ),
                    ),

                    const SizedBox(height: 20),

                    const Text(
                      APP_DESCRIPTION,
                      textAlign: TextAlign.center,
                      style: TextStyle(
                        fontSize: 18,
                      ),
                    ),

                    const SizedBox(height: 35),

                    ElevatedButton(
                      onPressed: () {},
                      child: const Text(
                        "ابدأ الآن",
                      ),
                    ),
                  ],
                ),
              ),
            ),
          );
        }
      }
      """

      dart = dart.replace(
          "APP_TITLE",
          "'" + app_name.replace("'", "\\'") + "'"
      )

      dart = dart.replace(
          "APP_DESCRIPTION",
          "'" + description.replace("'", "\\'") + "'"
      )

      path.write_text(dart, encoding="utf-8")
      PY

  - name: Get dependencies
    working-directory: flutter_app
    run: flutter pub get

  - name: Build APK
    working-directory: flutter_app
    run: flutter build apk --release

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Code2APK-${{ inputs.project_name }}
      path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
