name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Application name"
        required: true
        type: string

      package_id:
        description: "Android package ID"
        required: true
        type: string

      project_name:
        description: "Flutter project name"
        required: true
        type: string

      description:
        description: "Application description"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.6"
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          rm -rf flutter_app

          flutter create \
            --org "${{ inputs.package_id }}" \
            --project-name "${{ inputs.project_name }}" \
            flutter_app

      - name: Generate application
        working-directory: flutter_app
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_DESCRIPTION: ${{ inputs.description }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          app_name = os.environ["APP_NAME"]
          description = os.environ["APP_DESCRIPTION"]

          # ------------------------------------------------
          # Detect application type
          # ------------------------------------------------

          text = description.lower()

          is_calculator = any(word in text for word in [
              "حاسبة",
              "حاسبه",
              "حساب",
              "calculator",
              "calc"
          ])

          # ------------------------------------------------
          # Calculator application
          # ------------------------------------------------

          if is_calculator:

              main_dart = r'''
          import 'package:flutter/material.dart';

          void main() {
            runApp(const CalculatorApp());
          }

          class CalculatorApp extends StatelessWidget {
            const CalculatorApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'APP_NAME',
                theme: ThemeData(
                  brightness: Brightness.dark,
                  useMaterial3: true,
                ),
                home: const CalculatorPage(),
              );
            }
          }

          class CalculatorPage extends StatefulWidget {
            const CalculatorPage({super.key});

            @override
            State<CalculatorPage> createState() =>
                _CalculatorPageState();
          }

          class _CalculatorPageState
              extends State<CalculatorPage> {

            String display = '0';
            double? firstNumber;
            String? operation;
            bool newNumber = true;

            void press(String value) {
              setState(() {

                if (value == 'C') {
                  display = '0';
                  firstNumber = null;
                  operation = null;
                  newNumber = true;
                  return;
                }

                if (value == '+' ||
                    value == '-' ||
                    value == '×' ||
                    value == '÷') {

                  firstNumber =
                      double.tryParse(display) ?? 0;

                  operation = value;
                  newNumber = true;
                  return;
                }

                if (value == '=') {
                  final secondNumber =
                      double.tryParse(display) ?? 0;

                  if (firstNumber != null &&
                      operation != null) {

                    double result = 0;

                    switch (operation) {
                      case '+':
                        result = firstNumber! + secondNumber;
                        break;

                      case '-':
                        result = firstNumber! - secondNumber;
                        break;

                      case '×':
                        result = firstNumber! * secondNumber;
                        break;

                      case '÷':
                        if (secondNumber == 0) {
                          display = 'خطأ';
                          firstNumber = null;
                          operation = null;
                          newNumber = true;
                          return;
                        }

                        result =
                            firstNumber! / secondNumber;
                        break;
                    }

                    if (result == result.roundToDouble()) {
                      display = result.toInt().toString();
                    } else {
                      display = result.toString();
                    }

                    firstNumber = null;
                    operation = null;
                    newNumber = true;
                  }

                  return;
                }

                if (value == '.') {

                  if (newNumber) {
                    display = '0.';
                    newNumber = false;
                  } else if (!display.contains('.')) {
                    display += '.';
                  }

                  return;
                }

                if (newNumber || display == '0') {
                  display = value;
                  newNumber = false;
                } else {
                  display += value;
                }
              });
            }

            Widget calculatorButton(
                String value,
                {bool operationButton = false}) {

              return Expanded(
                child: Padding(
                  padding: const EdgeInsets.all(5),
                  child: ElevatedButton(
                    onPressed: () => press(value),
                    child: Text(
                      value,
                      style: const TextStyle(
                        fontSize: 26,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {

              return Scaffold(
                appBar: AppBar(
                  title: const Text('APP_NAME'),
                  centerTitle: true,
                ),

                body: SafeArea(
                  child: Column(
                    children: [

                      Expanded(
                        flex: 2,
                        child: Container(
                          width: double.infinity,
                          padding: const EdgeInsets.all(25),
                          alignment: Alignment.bottomRight,
                          child: FittedBox(
                            fit: BoxFit.scaleDown,
                            alignment: Alignment.centerRight,
                            child: Text(
                              display,
                              style: const TextStyle(
                                fontSize: 56,
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                          ),
                        ),
                      ),

                      Expanded(
                        flex: 5,
                        child: Column(
                          children: [

                            Expanded(
                              child: Row(
                                children: [
                                  calculatorButton('7'),
                                  calculatorButton('8'),
                                  calculatorButton('9'),
                                  calculatorButton('÷'),
                                ],
                              ),
                            ),

                            Expanded(
                              child: Row(
                                children: [
                                  calculatorButton('4'),
                                  calculatorButton('5'),
                                  calculatorButton('6'),
                                  calculatorButton('×'),
                                ],
                              ),
                            ),

                            Expanded(
                              child: Row(
                                children: [
                                  calculatorButton('1'),
                                  calculatorButton('2'),
                                  calculatorButton('3'),
                                  calculatorButton('-'),
                                ],
                              ),
                            ),

                            Expanded(
                              child: Row(
                                children: [
                                  calculatorButton('0'),
                                  calculatorButton('.'),
                                  calculatorButton('C'),
                                  calculatorButton('+'),
                                ],
                              ),
                            ),

                            Expanded(
                              child: Row(
                                children: [
                                  calculatorButton('='),
                                ],
                              ),
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          '''

              main_dart = main_dart.replace(
                  "APP_NAME",
                  app_name.replace("'", "\\'")
              )

              Path("lib/main.dart").write_text(
                  main_dart,
                  encoding="utf-8"
              )

          else:

              # ------------------------------------------------
              # Default application
              # ------------------------------------------------

              main_dart = f'''
          import 'package:flutter/material.dart';

          void main() {{
            runApp(const MyApp());
          }}

          class MyApp extends StatelessWidget {{
            const MyApp({{super.key}});

            @override
            Widget build(BuildContext context) {{
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: '{app_name.replace("'", "\\'")}',
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: Colors.blue,
                  ),
                  useMaterial3: true,
                ),
                home: Scaffold(
                  appBar: AppBar(
                    title: const Text(
                      '{app_name.replace("'", "\\'")}',
                    ),
                  ),
                  body: Center(
                    child: Text(
                      '{description.replace("'", "\\'")}',
                      textAlign: TextAlign.center,
                      style: const TextStyle(
                        fontSize: 22,
                      ),
                    ),
                  ),
                ),
              );
            }}
          }}
          '''

              Path("lib/main.dart").write_text(
                  main_dart,
                  encoding="utf-8"
              )

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Code2APK-${{ inputs.project_name }}
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
